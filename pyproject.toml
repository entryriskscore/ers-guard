[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ers-guard"
version = "0.1.2"
description = "Entry-risk check for trading bots, built on the Entry Risk Score API. Not a signal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Entry Risk Score" }]
keywords = ["binance", "futures", "risk", "trading-bot", "freqtrade", "ccxt", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
certifi = ["certifi"]

[project.urls]
Homepage = "https://entryriskscore.com"
Documentation = "https://entryriskscore.com/docs/guard"
Repository = "https://github.com/entryriskscore/ers-guard"
Changelog = "https://github.com/entryriskscore/ers-guard/blob/main/CHANGELOG.md"
Issues = "https://github.com/entryriskscore/ers-guard/issues"

[project.scripts]
ers-guard = "ers_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
