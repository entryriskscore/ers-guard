name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest          # Apple-silicon runners: no Python 3.9 build from setup-python
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install ruff
          ruff check src tests integrations examples tools
      - name: Unit tests (local fake API, no secrets, no network; includes the Node.js client tests)
        run: python -m unittest discover -s tests -v
